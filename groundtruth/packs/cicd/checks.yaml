# Required checks per fixture before AUTO_FIX is permitted
fixture_1_auth_refactor:
  required_checks:
    - log_anomaly
    - commit_change
    - negative_check
  ground_truth_cause: "NullPointerException in TokenValidator due to unhandled None in auth refactor commit"
  recommended_action: "AUTO_FIX"

fixture_2_dep_version_mismatch:
  required_checks:
    - log_anomaly
    - dependency_bump
    - intel_match
  ground_truth_cause: "Breaking API change introduced in urllib3 bump from 1.26 to 2.0"
  recommended_action: "AUTO_FIX"

fixture_3_oom_pod_crash:

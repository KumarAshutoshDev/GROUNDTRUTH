  required_checks:
    - log_anomaly
    - commit_change
  ground_truth_cause: "YAML syntax indentation error in kubernetes deployment manifest"
  recommended_action: "AUTO_FIX"

fixture_5_db_migration_deadlock:
  required_checks:
    - log_anomaly
    - commit_change
    - negative_check
  ground_truth_cause: "Lock timeout on users table during alembic migration 0042_add_index"
